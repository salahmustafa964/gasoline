<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسجيل الدخول</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=18"></head>
<body class="login"><form class="login-box" id="f">
<h1 id="t">نظام الجازولين</h1><p>سجّل دخولك للمتابعة</p>
<label for="e">البريد الإلكتروني</label><input id="e" type="email" required autocomplete="username">
<label for="p">كلمة المرور</label><input id="p" type="password" required autocomplete="current-password">
<button class="btn full" type="submit">دخول</button><div class="err" id="m" role="alert"></div></form>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {firebaseConfig,APP_NAME} from "./firebase-config.js?v=18";
document.getElementById("t").textContent=APP_NAME;
const auth=getAuth(initializeApp(firebaseConfig));
onAuthStateChanged(auth,u=>{if(u)location.href="index.html"});
f.addEventListener("submit",async ev=>{ev.preventDefault();m.textContent="";
 try{await signInWithEmailAndPassword(auth,e.value.trim(),p.value)}
 catch{m.textContent="البريد أو كلمة المرور غير صحيحة، تأكد منهما وحاول مرة أخرى."}});
</script></body></html>
